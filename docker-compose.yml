services:
  postgres:
    image: postgres:16-alpine
    container_name: mgwr-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mygateway_rental
    volumes:
      - mgwr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mygateway_rental']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mgwr_pg_data:
